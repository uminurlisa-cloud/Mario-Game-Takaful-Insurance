<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Takaful & Insurance Quest - Commercial Edition</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { background: #0f172a; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; color: #fff; overflow: hidden; }
    #game-container { position: relative; width: 900px; height: 500px; max-width: 100vw; max-height: 100vh; background: #000; border-radius: 12px; box-shadow: 0 20px 50px rgba(0,0,0,0.6); overflow: hidden; }
    canvas { width: 100%; height: 100%; display: block; }
    .hud { position: absolute; top: 15px; left: 20px; right: 20px; display: flex; justify-content: space-between; font-size: 18px; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); pointer-events: none; }
    .modal { position: absolute; inset: 0; background: rgba(15, 23, 42, 0.92); display: none; flex-direction: column; align-items: center; justify-content: center; padding: 30px; text-align: center; backdrop-filter: blur(8px); }
    .modal.active { display: flex; }
    .modal-card { background: #1e293b; border: 2px solid #38bdf8; border-radius: 16px; padding: 25px; width: 100%; max-width: 600px; box-shadow: 0 10px 30px rgba(56,189,248,0.2); }
    .modal h2 { color: #38bdf8; margin-bottom: 15px; font-size: 22px; }
    .modal p { font-size: 16px; line-height: 1.5; color: #cbd5e1; margin-bottom: 20px; }
    .options-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 15px; }
    .btn-option { background: #334155; border: 1px solid #475569; color: #fff; padding: 12px 18px; border-radius: 8px; font-size: 15px; cursor: pointer; text-align: left; transition: all 0.2s; }
    .btn-option:hover { background: #0284c7; border-color: #38bdf8; }
    .explanation { background: #0f172a; padding: 12px; border-radius: 8px; border-left: 4px solid #38bdf8; font-size: 14px; text-align: left; color: #94a3b8; display: none; margin-bottom: 15px; }
    .btn-action { background: #10b981; color: #fff; border: none; padding: 12px 30px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; display: none; }
    .mobile-controls { position: absolute; bottom: 15px; left: 15px; right: 15px; display: flex; justify-content: space-between; pointer-events: none; }
    .touch-btn { background: rgba(255,255,255,0.25); border: 2px solid rgba(255,255,255,0.4); width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: bold; color: white; pointer-events: auto; }
  </style>
</head>
<body>

<div id="game-container">
  <canvas id="gameCanvas" width="900" height="500"></canvas>
  
  <div class="hud">
    <div>SCORE: <span id="scoreText" style="color: #facc15;">0</span></div>
    <div>SHIELD: <span id="shieldText" style="color: #38bdf8;">INACTIVE</span></div>
    <div>PROGRESS: <span id="progressText" style="color: #4ade80;">0/4</span></div>
  </div>

  <div id="quizModal" class="modal">
    <div class="modal-card">
      <h2 id="quizTitle">TAKAFUL & INSURANCE QUESTION</h2>
      <p id="questionText">Loading Question...</p>
      <div id="optionsContainer" class="options-grid"></div>
      <div id="explanationBox" class="explanation"></div>
      <button id="nextBtn" class="btn-action" onclick="closeQuiz()">CONTINUE GAME</button>
    </div>
  </div>

  <div class="mobile-controls">
    <div style="display: flex; gap: 10px;">
      <div class="touch-btn" id="btnLeft">◀</div>
      <div class="touch-btn" id="btnRight">▶</div>
    </div>
    <div class="touch-btn" id="btnJump" style="background: rgba(56, 189, 248, 0.4);">▲</div>
  </div>
</div>

<script>
  // Game Audio Synth (Zero external audio assets required)
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function playSound(type) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;
    
    if (type === 'jump') {
      osc.frequency.setValueAtTime(150, now);
      osc.frequency.exponentialRampToValueAtTime(400, now + 0.15);
      gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0, now + 0.15);
      osc.start(now); osc.stop(now + 0.15);
    } else if (type === 'correct') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(400, now);
      osc.frequency.setValueAtTime(600, now + 0.1);
      gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0, now + 0.3);
      osc.start(now); osc.stop(now + 0.3);
    } else if (type === 'wrong') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(200, now);
      osc.frequency.linearRampToValueAtTime(100, now + 0.3);
      gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0, now + 0.3);
      osc.start(now); osc.stop(now + 0.3);
    }
  }

  // Load Question Bank from External JSON
  let questionBank = [];
  fetch('questions.json')
    .then(res => res.json())
    .then(data => { questionBank = data; })
    .catch(() => {
      // Fallback in case JSON is loaded directly from local file protocol
      questionBank = [
        {
          question: "What is the primary core principle that differentiates Takaful from Conventional Insurance?",
          options: ["Mutual assistance and shared risk (Tabarru')", "Risk transfer to a commercial entity", "Guaranteed fixed monetary returns", "Unilateral profit contract"],
          correct: 0,
          explanation: "Takaful relies on Tabarru' (donation) and mutual indemnity among participants."
        }
      ];
    });

  // Canvas Setup & State
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  
  let score = 0, questionsAnswered = 0, currentQuestionIndex = 0, isShielded = false, isPaused = false;
  
  const player = { x: 50, y: 350, width: 32, height: 48, vx: 0, vy: 0, grounded: false, speed: 4, jumpPower: -11 };
  const gravity = 0.5;

  const platforms = [
    { x: 0, y: 440, w: 1200, h: 60, type: 'ground' },
    { x: 220, y: 320, w: 120, h: 20, type: 'platform' },
    { x: 450, y: 240, w: 140, h: 20, type: 'platform' }
  ];

  const blocks = [
    { x: 260, y: 200, w: 40, h: 40, questionIdx: 0, active: true },
    { x: 500, y: 120, w: 40, h: 40, questionIdx: 1, active: true }
  ];

  const keys = { left: false, right: false, up: false };

  // Keyboard Listeners
  window.addEventListener('keydown', e => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
    if ((e.code === 'ArrowUp' || e.code === 'Space' || e.code === 'KeyW') && player.grounded) {
      keys.up = true; player.vy = player.jumpPower; player.grounded = false; playSound('jump');
    }
  });

  window.addEventListener('keyup', e => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
    if (e.code === 'ArrowUp' || e.code === 'Space' || e.code === 'KeyW') keys.up = false;
  });

  // Touch Listeners
  const bindTouch = (id, key) => {
    const el = document.getElementById(id);
    el.addEventListener('touchstart', (e) => { e.preventDefault(); if(key==='up' && player.grounded) { player.vy = player.jumpPower; player.grounded = false; playSound('jump'); } else { keys[key] = true; } });
    el.addEventListener('touchend', (e) => { e.preventDefault(); if(key!=='up') keys[key] = false; });
  };
  bindTouch('btnLeft', 'left'); bindTouch('btnRight', 'right'); bindTouch('btnJump', 'up');

  // Game Physics Loop
  function update() {
    if (isPaused) return;

    if (keys.left) player.vx = -player.speed;
    else if (keys.right) player.vx = player.speed;
    else player.vx *= 0.8;

    player.vy += gravity;
    player.x += player.vx;
    player.y += player.vy;

    // Platform Collisions
    player.grounded = false;
    platforms.forEach(p => {
      if (player.x < p.x + p.w && player.x + player.width > p.x &&
          player.y + player.height > p.y && player.y + player.height - player.vy <= p.y) {
        player.y = p.y - player.height;
        player.vy = 0;
        player.grounded = true;
      }
    });

    // Question Block Collisions (Hit from bottom)
    blocks.forEach(b => {
      if (b.active && player.x < b.x + b.w && player.x + player.width > b.x &&
          player.y < b.y + b.h && player.y + player.height > b.y) {
        if (player.vy < 0 && player.y > b.y + b.h - 12) {
          player.vy = 2;
          triggerQuiz(b);
        }
      }
    });

    // Screen Boundaries
    if (player.x < 0) player.x = 0;
    if (player.x > canvas.width - player.width) player.x = canvas.width - player.width;
  }

  function triggerQuiz(block) {
    isPaused = true;
    currentQuestionBlock = block;
    const qData = questionBank[block.questionIdx % questionBank.length];
    
    document.getElementById('questionText').innerText = qData.question;
    const optionsDiv = document.getElementById('optionsContainer');
    optionsDiv.innerHTML = '';
    document.getElementById('explanationBox').style.display = 'none';
    document.getElementById('nextBtn').style.display = 'none';

    qData.options.forEach((opt, idx) => {
      const btn = document.createElement('button');
      btn.className = 'btn-option';
      btn.innerText = `${String.fromCharCode(65 + idx)}. ${opt}`;
      btn.onclick = () => handleAnswer(idx, qData.correct, qData.explanation);
      optionsDiv.appendChild(btn);
    });

    document.getElementById('quizModal').classList.add('active');
  }

  function handleAnswer(selectedIndex, correctIndex, explanationText) {
    const btns = document.querySelectorAll('.btn-option');
    btns.forEach(b => b.style.pointerEvents = 'none');

    const expBox = document.getElementById('explanationBox');
    expBox.style.display = 'block';
    expBox.innerText = explanationText;

    if (selectedIndex === correctIndex) {
      playSound('correct');
      btns[selectedIndex].style.background = '#10b981';
      score += 250;
      isShielded = true;
      document.getElementById('scoreText').innerText = score;
      document.getElementById('shieldText').innerText = 'ACTIVE (100%)';
      document.getElementById('shieldText').style.color = '#10b981';
    } else {
      playSound('wrong');
      btns[selectedIndex].style.background = '#ef4444';
      btns[correctIndex].style.background = '#10b981';
    }

    currentQuestionBlock.active = false;
    questionsAnswered++;
    document.getElementById('progressText').innerText = `${questionsAnswered}/4`;
    document.getElementById('nextBtn').style.display = 'inline-block';
  }

  function closeQuiz() {
    document.getElementById('quizModal').classList.remove('active');
    isPaused = false;
  }

  // Render Loop
  function draw() {
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Draw Platforms
    platforms.forEach(p => {
      ctx.fillStyle = p.type === 'ground' ? '#1e293b' : '#334155';
      ctx.fillRect(p.x, p.y, p.w, p.h);
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(p.x, p.y, p.w, 4);
    });

    // Draw ? Blocks
    blocks.forEach(b => {
      ctx.fillStyle = b.active ? '#facc15' : '#475569';
      ctx.fillRect(b.x, b.y, b.w, b.h);
      ctx.fillStyle = '#000';
      ctx.font = 'bold 20px sans-serif';
      ctx.fillText(b.active ? '?' : '✓', b.x + 14, b.y + 27);
    });

    // Draw Player
    ctx.fillStyle = isShielded ? '#38bdf8' : '#ef4444';
    ctx.fillRect(player.x, player.y, player.width, player.height);
    
    // Shield aura
    if (isShielded) {
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 3;
      ctx.strokeRect(player.x - 4, player.y - 4, player.width + 8, player.height + 8);
    }
  }

  function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
  }

  gameLoop();
</script>
</body>
</html>
